<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" fill="#1f2328" font-weight="700">Multiplayer in Slack - the brain is in the room</text>
  <text x="40" y="70" font-size="13" fill="#57606a">Anyone the gate admits @-mentions the persona; it reads the thread, thinks over its whole brain, commits the evidence, then answers in the thread.</text>
  <rect x="40" y="96" width="360" height="528" rx="14" fill="#f9f0f9" stroke="#611f69" stroke-width="1.5"/>
  <text x="56" y="120" font-size="11.5" fill="#4a154b" font-weight="700" letter-spacing="0.6">SLACK - one workspace, one room per brain</text>
  <rect x="56" y="134" width="328" height="316" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="72" y="158" font-size="14" fill="#1f2328" font-weight="700"># core-team</text>
  <text x="172" y="158" font-size="11.5" fill="#57606a">org brain · anyone in the channel</text>
  <rect x="72" y="174" width="26" height="26" rx="6" fill="#bf8700"/>
  <text x="108" y="185" font-size="12"><tspan font-weight="700" fill="#1f2328">Sam</tspan></text>
  <text x="108" y="202" font-size="12" fill="#3d444d">is the franchise tax on our radar?</text>
  <rect x="72" y="222" width="26" height="26" rx="6" fill="#1a7f37"/>
  <text x="108" y="233" font-size="12"><tspan font-weight="700" fill="#1f2328">Jo</tspan></text>
  <text x="108" y="250" font-size="12" fill="#3d444d">@Persona what's due this week?</text>
  <rect x="108" y="262" width="46" height="22" rx="11" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
  <text x="131.0" y="277" font-size="11" fill="#0a5bd3" font-weight="600" text-anchor="middle">👀 1</text>
  <line x1="86" y1="296" x2="86" y2="436" stroke="#d0d7de" stroke-width="2"/>
  <text x="100" y="304" font-size="11" fill="#0969da" font-weight="600">thread · 1 reply</text>
  <rect x="100" y="314" width="26" height="26" rx="6" fill="#611f69"/>
  <text x="136" y="325" font-size="12"><tspan font-weight="700" fill="#1f2328">Persona</tspan> <tspan font-size="9.5" font-weight="700" fill="#4a154b">APP</tspan></text>
  <text x="136" y="342" font-size="12" fill="#3d444d">Nothing hard is due this week.</text>
  <text x="136" y="358" font-size="12" fill="#3d444d">Franchise tax is next, in February,</text>
  <text x="136" y="374" font-size="12" fill="#3d444d">and the calendar already has it.</text>
  <text x="136" y="390" font-size="12" fill="#3d444d">Sam, it's tracked. No action needed.</text>
  <rect x="56" y="462" width="328" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="72" y="486" font-size="14" fill="#1f2328" font-weight="700"># me</text>
  <text x="118" y="486" font-size="11.5" fill="#57606a">person brain · only you, plus DMs</text>
  <text x="72" y="508" font-size="12" fill="#3d444d">its own app, its own Worker, its own brain;</text>
  <text x="72" y="525" font-size="12" fill="#3d444d">it sees company data only via share: grants</text>
  <text x="56" y="576" font-size="11.5" fill="#4a154b" font-style="italic">Bots are never heard, so two brains'</text>
  <text x="56" y="593" font-size="11.5" fill="#4a154b" font-style="italic">agents in one workspace can't loop.</text>
  <rect x="440" y="96" width="420" height="528" rx="14" fill="#fff8f0" stroke="#f6821f" stroke-width="1.5"/>
  <text x="456" y="120" font-size="11.5" fill="#9a5b13" font-weight="700" letter-spacing="0.6">CLOUDFLARE - the brain's heartbeat Worker</text>
  <rect x="456" y="134" width="388" height="196" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="472" y="158" font-size="14" font-weight="700" fill="#1f2328">POST /slack/events <tspan font-weight="400" font-size="11.5" fill="#57606a">- inside Slack's 3 s</tspan></text>
  <circle cx="482" cy="180" r="10" fill="#0a5bd3"/>
  <text x="482" y="184" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="500" y="184" font-size="12" fill="#3d444d"><tspan font-weight="700" fill="#1f2328">verify</tspan>  HMAC-SHA256 + 5-min window, else 401</text>
  <circle cx="482" cy="209" r="10" fill="#0a5bd3"/>
  <text x="482" y="213" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="500" y="213" font-size="12" fill="#3d444d"><tspan font-weight="700" fill="#1f2328">filter</tspan>  app_mention or app DM; bots and edits dropped</text>
  <circle cx="482" cy="238" r="10" fill="#0a5bd3"/>
  <text x="482" y="242" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="500" y="242" font-size="12" fill="#3d444d"><tspan font-weight="700" fill="#1f2328">gate</tspan>  allowlist, or * = whoever is in the pinned room</text>
  <circle cx="482" cy="267" r="10" fill="#0a5bd3"/>
  <text x="482" y="271" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="500" y="271" font-size="12" fill="#3d444d"><tspan font-weight="700" fill="#1f2328">dedup</tspan>  event_id (Slack retries) + the daily budget</text>
  <circle cx="482" cy="296" r="10" fill="#0a5bd3"/>
  <text x="482" y="300" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="500" y="300" font-size="12" fill="#3d444d"><tspan font-weight="700" fill="#1f2328">ack</tspan>  200 now, 👀 on the mention, queue it</text>
  <rect x="456" y="342" width="388" height="172" rx="10" fill="#edf5ff" stroke="#54aeff" stroke-width="1.2"/>
  <text x="472" y="366" font-size="14" font-weight="700" fill="#0a5bd3">DirectionDO alarm <tspan font-weight="400" font-size="11.5" fill="#57606a">- the slow part</tspan></text>
  <circle cx="482" cy="390" r="10" fill="#0a5bd3"/>
  <text x="482" y="394" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="500" y="394" font-size="12" fill="#33445c"><tspan font-weight="700" fill="#0a5bd3">read</tspan>  the thread as context (never committed)</text>
  <circle cx="482" cy="419" r="10" fill="#0a5bd3"/>
  <text x="482" y="423" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
  <text x="500" y="423" font-size="12" fill="#33445c"><tspan font-weight="700" fill="#0a5bd3">think</tspan>  one agentic run, audience: group</text>
  <circle cx="482" cy="448" r="10" fill="#0a5bd3"/>
  <text x="482" y="452" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">8</text>
  <text x="500" y="452" font-size="12" fill="#33445c"><tspan font-weight="700" fill="#0a5bd3">commit</tspan>  the mention + reply + ledger, ONE commit</text>
  <circle cx="482" cy="477" r="10" fill="#0a5bd3"/>
  <text x="482" y="481" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">9</text>
  <text x="500" y="481" font-size="12" fill="#33445c"><tspan font-weight="700" fill="#0a5bd3">reply</tspan>  in the mention's thread, after the commit</text>
  <rect x="456" y="526" width="388" height="82" rx="10" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="472" y="550" font-size="14" font-weight="700" fill="#116329">HeartbeatDO <tspan font-weight="400" font-size="11.5" fill="#57606a">- 08:00 local</tspan></text>
  <text x="472" y="572" font-size="12" fill="#2f4a3a">the daily brief posts to the room, head in the</text>
  <text x="472" y="589" font-size="12" fill="#2f4a3a">channel, the rest threaded; failures alert there</text>
  <rect x="900" y="96" width="340" height="206" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="916" y="122" font-size="14" fill="#1f2328" font-weight="700">the brain - private GitHub repo</text>
  <text x="916" y="146" font-size="12" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">direction: 1 processed</text>
  <text x="916" y="164" font-size="11.5" fill="#57606a" font-style="italic">authored by the mesh, never forced</text>
  <text x="916" y="190" font-size="12" fill="#3d444d">reports/…direction-1a2b3c4d.md</text>
  <text x="927" y="208" font-size="12" fill="#3d444d">the mention, the reply, audience: group</text>
  <text x="916" y="226" font-size="12" fill="#3d444d">ledger: direction-started → completed</text>
  <text x="916" y="244" font-size="12" fill="#3d444d">denied knocks are ledgered too</text>
  <text x="916" y="288" font-size="11.5" fill="#57606a" font-style="italic">git log is the audit trail of every answer</text>
  <rect x="900" y="318" width="340" height="104" rx="10" fill="#fbf5ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="916" y="344" font-size="14" fill="#6639ba" font-weight="700">model vendor</text>
  <text x="916" y="366" font-size="12" fill="#4a3a63">plain fetch, no SDK; reads the whole brain,</text>
  <text x="916" y="383" font-size="12" fill="#4a3a63">declared sources, and what linked brains</text>
  <text x="916" y="400" font-size="12" fill="#4a3a63">share with it, then decides the disposition</text>
  <rect x="900" y="440" width="340" height="168" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="916" y="470" font-size="14" fill="#57606a" font-weight="700">no cloud tier? the laptop</text>
  <text x="916" y="494" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">anima-mesh slack listen</text>
  <text x="916" y="520" font-size="12" fill="#3d444d">polls the room with the bot token: no public</text>
  <text x="916" y="537" font-size="12" fill="#3d444d">endpoint, no signing secret, subprocess</text>
  <text x="916" y="554" font-size="12" fill="#3d444d">harnesses welcome; same gates, and the</text>
  <text x="916" y="571" font-size="12" fill="#3d444d">ledger is the dedup, so restarts are safe</text>
  <line x1="384" y1="236" x2="452" y2="236" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="418" y="228" font-size="11" fill="#57606a" text-anchor="middle">event</text>
  <line x1="454" y1="300" x2="386" y2="300" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="420" y="292" font-size="12" fill="#1f2328" text-anchor="middle">👀</text>
  <path d="M 456 480 C 420 480, 420 390, 388 390" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="426" y="456" font-size="11" fill="#57606a" text-anchor="middle">reply</text>
  <line x1="898" y1="140" x2="864" y2="140" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="881" y="132" font-size="10.5" fill="#57606a" text-anchor="middle">read</text>
  <path d="M 846 452 L 880 452 L 880 250 L 896 250" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="874" y="350" font-size="10.5" fill="#57606a" text-anchor="middle" transform="rotate(-90 874 350)">1 commit</text>
  <line x1="846" y1="400" x2="896" y2="372" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="40" y1="644" x2="1240" y2="644" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="670" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#1f2328">Safety in code, not in the prompt:</tspan> who may direct, in which rooms, and that bots never trigger a run are all gates the model never sees.</text>
  <text x="40" y="692" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#0a5bd3">Evidence before words:</tspan> the reply is posted only after its commit lands. Other people's messages are read for the run and never stored.</text>
</svg>
