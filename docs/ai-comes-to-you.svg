<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="acy-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="acy-ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#1f2328">The AI comes to you — the mesh's push posture</text>
  <text x="40" y="70" font-size="13" fill="#57606a">Founder attention is the scarce resource. Nothing here asks to be checked: every output lands in a channel the human already lives in — and it arrives with the work started.</text>

  <!-- ==================== LEFT: THE MESH, ON ITS OWN CLOCK ==================== -->
  <rect x="40" y="120" width="255" height="330" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="60" y="150" font-size="16" font-weight="700" fill="#0550ae">The mesh, on its own clock</text>
  <text x="60" y="176" font-size="12.5" fill="#2f4a5a">08:00 — the beat: every due agent</text>
  <text x="60" y="193" font-size="12.5" fill="#2f4a5a">runs once, reports written, ledger</text>
  <text x="60" y="210" font-size="12.5" fill="#2f4a5a">appended, repo committed.</text>

  <rect x="60" y="228" width="215" height="88" rx="8" fill="#ffffff" stroke="#9ec5e8" stroke-width="1.1"/>
  <text x="76" y="252" font-size="12.5" font-weight="700" fill="#1f2328">Delivery is part of the beat</text>
  <text x="76" y="272" font-size="12" fill="#57606a">not an afterthought: the run isn't</text>
  <text x="76" y="289" font-size="12" fill="#57606a">done until the human has been</text>
  <text x="76" y="306" font-size="12" fill="#57606a">told what it means for them.</text>

  <text x="60" y="348" font-size="12.5" fill="#2f4a5a">The machine holds the calendar,</text>
  <text x="60" y="365" font-size="12.5" fill="#2f4a5a">the state, the day counts. The</text>
  <text x="60" y="382" font-size="12.5" fill="#2f4a5a">human holds only the decisions.</text>
  <text x="60" y="422" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0550ae">harness/heartbeat-core.ts</text>

  <path d="M 295 285 L 348 285" stroke="#57606a" stroke-width="1.6" marker-end="url(#acy-ar)"/>

  <!-- ==================== CENTER: WHAT TRAVELS ==================== -->
  <rect x="352" y="110" width="600" height="430" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="372" y="138" font-size="14" font-weight="700" fill="#1f2328">What travels — always toward the human, never empty-handed</text>

  <!-- Row 1 -->
  <rect x="372" y="152" width="275" height="106" rx="8" fill="#ddf4ff" stroke="#9ec5e8" stroke-width="1.1"/>
  <text x="388" y="176" font-size="13" font-weight="700" fill="#0550ae">The daily brief</text>
  <text x="388" y="196" font-size="12" fill="#57606a">Arrives as a bot DM — the whole</text>
  <text x="388" y="213" font-size="12" fill="#57606a">brief, chunked and paced. Leads</text>
  <text x="388" y="230" font-size="12" fill="#57606a">with what needs YOU today,</text>
  <text x="388" y="247" font-size="12" fill="#57606a">nags first.</text>

  <rect x="662" y="152" width="275" height="106" rx="8" fill="#ffebe9" stroke="#f1a8a2" stroke-width="1.1"/>
  <text x="678" y="176" font-size="13" font-weight="700" fill="#a40e26">The failure DM</text>
  <text x="678" y="196" font-size="12" fill="#57606a">A failed beat reports itself —</text>
  <text x="678" y="213" font-size="12" fill="#57606a">agent, error, run id. Silence is</text>
  <text x="678" y="230" font-size="12" fill="#57606a">never ambiguous: no news</text>
  <text x="678" y="247" font-size="12" fill="#57606a">really is good news.</text>

  <!-- Row 2 -->
  <rect x="372" y="274" width="275" height="106" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.1"/>
  <text x="388" y="298" font-size="13" font-weight="700" fill="#9a6700">The nag — day 19 and counting</text>
  <text x="388" y="318" font-size="12" fill="#57606a">"Bug me daily until I do this" as</text>
  <text x="388" y="335" font-size="12" fill="#57606a">data: re-arrives every morning</text>
  <text x="388" y="352" font-size="12" fill="#57606a">with its day count until the</text>
  <text x="388" y="369" font-size="12" fill="#57606a">done-condition is met.</text>

  <rect x="662" y="274" width="275" height="106" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.1"/>
  <text x="678" y="298" font-size="13" font-weight="700" fill="#9a6700">The blocked ask</text>
  <text x="678" y="318" font-size="12" fill="#57606a">Due work the cloud tier CAN'T</text>
  <text x="678" y="335" font-size="12" fill="#57606a">run becomes an explicit ask for</text>
  <text x="678" y="352" font-size="12" fill="#57606a">the manual run it is owed —</text>
  <text x="678" y="369" font-size="12" fill="#57606a">never a journal-only skip.</text>

  <!-- Row 3 -->
  <rect x="372" y="396" width="275" height="106" rx="8" fill="#e9f5ee" stroke="#a9d6bb" stroke-width="1.1"/>
  <text x="388" y="420" font-size="13" font-weight="700" fill="#116329">The prep pack</text>
  <text x="388" y="440" font-size="12" fill="#57606a">The ask arrives with the work</text>
  <text x="388" y="457" font-size="12" fill="#57606a">started: session starter to paste,</text>
  <text x="388" y="474" font-size="12" fill="#57606a">pre-work done, forced-choice</text>
  <text x="388" y="491" font-size="12" fill="#57606a">"quiz me" questions.</text>

  <rect x="662" y="396" width="275" height="106" rx="8" fill="#e9f5ee" stroke="#a9d6bb" stroke-width="1.1"/>
  <text x="678" y="420" font-size="13" font-weight="700" fill="#116329">The ticket</text>
  <text x="678" y="440" font-size="12" fill="#57606a">Engine misbehavior → an issue</text>
  <text x="678" y="457" font-size="12" fill="#57606a">filed in the maintainer's queue</text>
  <text x="678" y="474" font-size="12" fill="#57606a">(stop 6's pipeline decides what</text>
  <text x="678" y="491" font-size="12" fill="#57606a">may leave). Work comes to them too.</text>

  <path d="M 952 315 L 1006 315" stroke="#57606a" stroke-width="1.6" marker-end="url(#acy-ar)"/>

  <!-- ==================== RIGHT: YOU ==================== -->
  <rect x="1010" y="190" width="230" height="250" rx="14" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="1030" y="220" font-size="16" font-weight="700" fill="#116329">You — minutes a day</text>
  <text x="1030" y="246" font-size="12.5" fill="#2f4a3a">Read the DM.</text>
  <text x="1030" y="266" font-size="12.5" fill="#2f4a3a">Answer a quiz question.</text>
  <text x="1030" y="286" font-size="12.5" fill="#2f4a3a">Approve / veto / redirect.</text>
  <text x="1030" y="318" font-size="12" fill="#57606a">No state to reload: the</text>
  <text x="1030" y="335" font-size="12" fill="#57606a">minutes start prepared.</text>
  <text x="1030" y="368" font-size="12.5" font-weight="700" fill="#116329">Judgment flows back:</text>
  <text x="1030" y="388" font-size="12.5" fill="#2f4a3a">a reply IS a direction —</text>
  <text x="1030" y="405" font-size="12.5" fill="#2f4a3a">one DM becomes one run.</text>

  <path d="M 1010 430 C 900 560, 420 560, 300 452" stroke="#1a7f37" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#acy-ar-g)"/>
  <text x="560" y="575" font-size="12" fill="#1a7f37">the return path is a chat message, not a form</text>

  <!-- ==================== BOTTOM: THE PULL TAX ==================== -->
  <rect x="40" y="608" width="1200" height="76" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="60" y="636" font-size="13" font-weight="700" fill="#57606a">Deliberately absent — the pull tax:</text>
  <text x="60" y="660" font-size="12.5" fill="#57606a">✕ a dashboard to open&#160;&#160;&#160;✕ a status meeting&#160;&#160;&#160;✕ a backlog to groom&#160;&#160;&#160;✕ "go check the logs" — each one taxes the human to hold state and remember to look. Here, forgetting is the machine's problem.</text>
</svg>
