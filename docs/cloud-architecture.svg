<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="980" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" fill="#1f2328" font-weight="700">AnimaMesh cloud tier - one engine, one Worker per brain</text>
  <text x="40" y="70" font-size="13" fill="#57606a">Scheduled beats + inbound directions from Slack, Discord, and email + a private dashboard. Git holds knowledge and evidence; Durable Objects hold only control state.</text>
  <text x="165" y="112" font-size="11.5" fill="#57606a" font-weight="700" text-anchor="middle" letter-spacing="0.8">THE PEOPLE (one human, or a team)</text>
  <rect x="40" y="126" width="250" height="222" rx="10" fill="#f9f0f9" stroke="#611f69" stroke-width="1.5"/>
  <text x="56" y="154" font-size="15" fill="#4a154b" font-weight="700">Slack</text>
  <text x="104" y="154" font-size="11.5" fill="#57606a">v2.3 · one channel per brain</text>
  <text x="56" y="178" font-size="12" fill="#3d2a3e">• @-mention the persona: anyone</text>
  <text x="67" y="197" font-size="12" fill="#3d2a3e">the gate admits; it reads the</text>
  <text x="67" y="216" font-size="12" fill="#3d2a3e">thread and answers in it</text>
  <text x="56" y="235" font-size="12" fill="#3d2a3e">• the daily brief, threaded</text>
  <text x="56" y="254" font-size="12" fill="#3d2a3e">• failure alerts</text>
  <text x="56" y="273" font-size="12" fill="#3d2a3e">• DMs to the app (allowlisted)</text>
  <text x="56" y="292" font-size="12" fill="#3d2a3e">• two brains' apps never loop:</text>
  <text x="67" y="311" font-size="12" fill="#3d2a3e">bots are never heard</text>
  <rect x="40" y="364" width="250" height="120" rx="10" fill="#eef1fe" stroke="#5865f2" stroke-width="1.5"/>
  <text x="56" y="392" font-size="15" fill="#3b45b0" font-weight="700">Discord</text>
  <text x="56" y="416" font-size="12" fill="#3f4660">• /direct in the persona's DM</text>
  <text x="56" y="435" font-size="12" fill="#3f4660">• brief + failure DMs</text>
  <text x="56" y="454" font-size="12" fill="#3f4660">• the principal only</text>
  <rect x="40" y="500" width="250" height="96" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="56" y="528" font-size="15" fill="#1f2328" font-weight="700">Email</text>
  <text x="56" y="552" font-size="12" fill="#3d444d">• mail from the principal is polled</text>
  <text x="67" y="571" font-size="12" fill="#3d444d">and answered by reply email</text>
  <rect x="40" y="640" width="250" height="160" rx="10" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="56" y="668" font-size="15" fill="#116329" font-weight="700">Browser</text>
  <text x="56" y="692" font-size="12" fill="#2f4a3a">the observability surface:</text>
  <text x="56" y="711" font-size="12" fill="#2f4a3a">• Google OIDC + email allowlist</text>
  <text x="56" y="730" font-size="12" fill="#2f4a3a">• beats, ledger, reports,</text>
  <text x="67" y="749" font-size="12" fill="#2f4a3a">approvals, engine pin</text>
  <text x="56" y="768" font-size="12" fill="#2f4a3a">• trigger a beat now</text>
  <rect x="330" y="100" width="550" height="720" rx="14" fill="#fff8f0" stroke="#f6821f" stroke-width="1.5"/>
  <text x="350" y="126" font-size="11.5" fill="#9a5b13" font-weight="700" letter-spacing="0.6">CLOUDFLARE - always on, no servers, nothing runs between events</text>
  <rect x="350" y="142" width="510" height="410" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="366" y="168" font-size="15" font-weight="700" fill="#1f2328">heartbeat Worker <tspan font-weight="400" fill="#57606a" font-size="12">- one per brain, the mesh's runtime</tspan></text>
  <rect x="366" y="184" width="230" height="196" rx="8" fill="#edf5ff" stroke="#54aeff" stroke-width="1.2"/>
  <text x="380" y="208" font-size="13.5" fill="#0a5bd3" font-weight="700">HeartbeatDO</text>
  <text x="380" y="230" font-size="12" fill="#33445c">daily alarm, DST-correct</text>
  <text x="380" y="249" font-size="12" fill="#33445c">runs every due agent:</text>
  <text x="380" y="268" font-size="12" fill="#33445c">spokes first, hub last;</text>
  <text x="380" y="287" font-size="12" fill="#33445c">a failed spoke never kills</text>
  <text x="380" y="306" font-size="12" fill="#33445c">the beat</text>
  <text x="380" y="325" font-size="12" fill="#33445c">state: alarm + beat lock</text>
  <text x="380" y="364" font-size="12" fill="#33445c" font-style="italic">re-arms in finally</text>
  <rect x="612" y="184" width="232" height="196" rx="8" fill="#edf5ff" stroke="#54aeff" stroke-width="1.2"/>
  <text x="626" y="208" font-size="13.5" fill="#0a5bd3" font-weight="700">DirectionDO</text>
  <text x="626" y="230" font-size="12" fill="#33445c">one queue for Slack, Discord,</text>
  <text x="626" y="249" font-size="12" fill="#33445c">and email; a shared daily</text>
  <text x="626" y="268" font-size="12" fill="#33445c">budget; dedup rings (Slack</text>
  <text x="626" y="287" font-size="12" fill="#33445c">event ids, Gmail ids)</text>
  <text x="626" y="306" font-size="12" fill="#33445c">immediate alarm drains:</text>
  <text x="626" y="325" font-size="12" fill="#33445c">one agentic run per message</text>
  <text x="626" y="364" font-size="12" fill="#33445c" font-style="italic">optional Gmail poll</text>
  <text x="605" y="406" font-size="11.5" fill="#3d444d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /slack/events (HMAC) · POST /interactions (Ed25519)</text>
  <text x="605" y="426" font-size="11.5" fill="#3d444d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /healthz · POST /beat (bearer) · GET /graph/check · /docs/check</text>
  <text x="605" y="446" font-size="11.5" fill="#3d444d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /.well-known/agent-card.json</text>
  <line x1="366" y1="462" x2="844" y2="462" stroke="#d0d7de" stroke-width="1"/>
  <text x="366" y="484" font-size="12" fill="#9a5b13" font-style="italic">gates in code: signatures, sender + room allowlists, budgets, bots ignored</text>
  <text x="366" y="504" font-size="12" fill="#9a5b13" font-style="italic">prompt = bundle + linked brains' grants + read sources + capability truth</text>
  <text x="366" y="524" font-size="12" fill="#9a5b13" font-style="italic">replies go out only AFTER the evidence commit lands</text>
  <rect x="350" y="596" width="510" height="204" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="366" y="622" font-size="15" font-weight="700" fill="#1f2328">web Worker <tspan font-weight="400" fill="#57606a" font-size="12">- the dashboard (a separate deploy)</tspan></text>
  <text x="366" y="648" font-size="12" fill="#3d444d">in-Worker Google OIDC; email allowlist re-checked on EVERY request</text>
  <text x="366" y="667" font-size="12" fill="#3d444d">nothing is served unauthenticated; strangers see only a login redirect</text>
  <text x="366" y="686" font-size="12" fill="#3d444d">server-rendered HTML: last beat, ledger tail, reports, approvals</text>
  <text x="366" y="705" font-size="12" fill="#3d444d">narrow env: a view-only brain read + the beat trigger; it can</text>
  <text x="366" y="724" font-size="12" fill="#3d444d">neither think nor speak as the persona</text>
  <text x="366" y="760" font-size="11.5" fill="#3d444d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/ · /auth/login · /auth/callback · /logout · POST /actions/beat</text>
  <rect x="920" y="100" width="320" height="196" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="936" y="126" font-size="15" fill="#1f2328" font-weight="700">the brain - private GitHub repo</text>
  <text x="936" y="150" font-size="12" fill="#3d444d">bundle/ (facts · decisions · agents ·</text>
  <text x="947" y="168" font-size="12" fill="#3d444d">constitution, one concept per file)</text>
  <text x="936" y="186" font-size="12" fill="#3d444d">ledger/actions.jsonl (append-only)</text>
  <text x="936" y="204" font-size="12" fill="#3d444d">reports/ · approvals/ · drafts/</text>
  <text x="936" y="230" font-size="12" fill="#1f2328" font-weight="600">read: one tarball per beat or drain</text>
  <text x="936" y="248" font-size="12" fill="#1f2328" font-weight="600">write: one commit per beat or drain,</text>
  <text x="947" y="266" font-size="12" fill="#1f2328" font-weight="600">authored by the mesh, never forced</text>
  <rect x="920" y="312" width="320" height="120" rx="10" fill="#edf5ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="936" y="338" font-size="15" fill="#0a5bd3" font-weight="700">linked brains</text>
  <text x="1046" y="338" font-size="11.5" fill="#57606a">v2.0</text>
  <text x="936" y="360" font-size="12" fill="#33445c">person · org · team · group; both sides</text>
  <text x="936" y="377" font-size="12" fill="#33445c">declare the link; read-only, and only</text>
  <text x="936" y="394" font-size="12" fill="#33445c">what each owner's share: grants allow</text>
  <text x="936" y="411" font-size="12" fill="#33445c">(markings like finance block)</text>
  <rect x="920" y="448" width="320" height="132" rx="10" fill="#fff8e5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="936" y="474" font-size="15" fill="#7d4e00" font-weight="700">read-only context sources</text>
  <text x="936" y="496" font-size="12" fill="#5c4813">OneDrive / SharePoint via Graph</text>
  <text x="936" y="513" font-size="12" fill="#5c4813">git-hosted docs via GitHub REST</text>
  <text x="936" y="530" font-size="12" fill="#5c4813">the principal's Gmail, Calendar, Drive:</text>
  <text x="947" y="547" font-size="12" fill="#5c4813">read-only scopes, redacted in code</text>
  <text x="936" y="564" font-size="12" fill="#5c4813">failure becomes honest prompt context</text>
  <rect x="920" y="596" width="320" height="104" rx="10" fill="#fbf5ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="936" y="622" font-size="15" fill="#6639ba" font-weight="700">model vendor APIs</text>
  <text x="936" y="644" font-size="12" fill="#4a3a63">pure fetch: no SDKs, no subprocesses</text>
  <text x="936" y="661" font-size="12" fill="#4a3a63">each agent declares model + harness;</text>
  <text x="936" y="678" font-size="12" fill="#4a3a63">subscription or metered, per agent</text>
  <rect x="920" y="716" width="320" height="104" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="936" y="742" font-size="15" fill="#57606a" font-weight="700">laptop tier (optional)</text>
  <text x="936" y="764" font-size="12" fill="#3d444d">same engine via CLI over a clone;</text>
  <text x="936" y="781" font-size="12" fill="#3d444d">subprocess harnesses; export-local;</text>
  <text x="936" y="798" font-size="12" fill="#3d444d">slack listen answers without a Worker</text>
  <line x1="292" y1="200" x2="346" y2="200" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="318" cy="200" r="10" fill="#0a5bd3"/>
  <text x="318" y="204" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="311" y="186" font-size="10" fill="#57606a" text-anchor="middle">mention</text>
  <line x1="346" y1="252" x2="294" y2="252" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="318" cy="252" r="10" fill="#611f69"/>
  <text x="318" y="256" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="311" y="238" font-size="10" fill="#57606a" text-anchor="middle">reply</text>
  <line x1="346" y1="300" x2="294" y2="300" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="318" cy="300" r="10" fill="#1a7f37"/>
  <text x="318" y="304" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="311" y="286" font-size="10" fill="#57606a" text-anchor="middle">brief</text>
  <line x1="292" y1="410" x2="346" y2="410" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="311" y="400" font-size="10" fill="#57606a" text-anchor="middle">/direct</text>
  <line x1="346" y1="548" x2="294" y2="548" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" marker-start="url(#arrow-dashed)"/>
  <text x="310" y="538" font-size="10" fill="#57606a" text-anchor="middle">poll</text>
  <line x1="292" y1="690" x2="346" y2="690" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="310" y="680" font-size="10" fill="#57606a" text-anchor="middle">OIDC</text>
  <line x1="346" y1="730" x2="294" y2="730" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="310" y="748" font-size="10" fill="#57606a" text-anchor="middle">HTML</text>
  <line x1="605" y1="594" x2="605" y2="556" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="615" y="580" font-size="11" fill="#57606a">POST /beat (token stays server-side)</text>
  <line x1="916" y1="160" x2="862" y2="160" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="900" y="152" font-size="10.5" fill="#57606a" text-anchor="middle">tarball</text>
  <line x1="862" y1="200" x2="916" y2="200" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="900" y="192" font-size="10.5" fill="#57606a" text-anchor="middle">commit</text>
  <line x1="916" y1="372" x2="862" y2="372" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="900" y="364" font-size="10.5" fill="#57606a" text-anchor="middle">grants</text>
  <line x1="916" y1="500" x2="862" y2="500" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="900" y="492" font-size="10.5" fill="#57606a" text-anchor="middle">read</text>
  <path d="M 862 530 C 890 560, 890 620, 916 640" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="898" y="586" font-size="10.5" fill="#57606a">think</text>
  <path d="M 1242 760 C 1270 600, 1270 300, 1242 200" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" marker-start="url(#arrow-dashed)"/>
  <text x="1262" y="480" font-size="10.5" fill="#57606a" text-anchor="middle" transform="rotate(90 1262 480)">git pull / push</text>
  <line x1="40" y1="846" x2="1240" y2="846" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="872" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#4a154b">1→2 a direction:</tspan> verify the signature → sender + room gate → dedup + budget → queue → the agent reads the thread, its brain, linked brains, and sources → ONE commit → reply in thread.</text>
  <text x="40" y="894" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#116329">3 a beat:</tspan> daily alarm → read the brain → run due agents → verifiers → ONE commit → the hub's brief to the brain's channels; a failure alerts the same channels.</text>
  <text x="40" y="916" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#1f2328">state boundary:</tspan> git holds durable knowledge and evidence; DO storage is limited to alarms, locks, queues, budgets, and dedup rings.</text>
  <text x="40" y="938" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#0a5bd3">many brains:</tspan> each brain deploys its own Worker from its own repo, pinned to the same public engine tag; they meet only through declared links.</text>
</svg>
