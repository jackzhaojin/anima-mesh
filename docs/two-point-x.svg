<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" fill="#1f2328" font-weight="700">AnimaMesh 2.x - from one company to a mesh of brains</text>
  <text x="40" y="70" font-size="13" fill="#57606a">Eleven releases, v2.0.0 to v2.3.2, October 10 to 18, 2026. Every safety property stays in code, and each one has a behavioral test.</text>
  <line x1="60" y1="118" x2="1236" y2="118" stroke="#d0d7de" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="130.0" cy="118" r="7" fill="#d0d7de"/>
  <rect x="40" y="146" width="180" height="340" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="56" y="180" font-size="24" fill="#1f2328" font-weight="700">v0.17</text>
  <text x="204" y="178" font-size="12" fill="#57606a" text-anchor="end">Oct 2</text>
  <text x="56" y="208" font-size="15" fill="#1f2328" font-weight="700">Before 2.0</text>
  <line x1="56" y1="222" x2="204" y2="222" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="250" font-size="13" fill="#3d444d">• one human, one repo</text>
  <text x="56" y="276" font-size="13" fill="#3d444d">• a daily heartbeat</text>
  <text x="56" y="302" font-size="13" fill="#3d444d">• approval gates</text>
  <text x="56" y="328" font-size="13" fill="#3d444d">• append-only ledger</text>
  <text x="56" y="354" font-size="13" fill="#3d444d">• Discord DM or email</text>
  <text x="56" y="390" font-size="13" fill="#3d444d" font-style="italic">a brain = a company</text>
  <circle cx="354.0" cy="118" r="7" fill="#54aeff"/>
  <rect x="232" y="146" width="244" height="340" rx="10" fill="#edf5ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="248" y="180" font-size="24" fill="#0a5bd3" font-weight="700">v2.0</text>
  <text x="460" y="178" font-size="12" fill="#57606a" text-anchor="end">Oct 10</text>
  <text x="248" y="208" font-size="15" fill="#1f2328" font-weight="700">The mesh of brains</text>
  <line x1="248" y1="222" x2="460" y2="222" stroke="#54aeff" stroke-width="1"/>
  <text x="248" y="250" font-size="13" fill="#33445c">• person, org, team, group</text>
  <text x="248" y="276" font-size="13" fill="#33445c">• links need both sides</text>
  <text x="248" y="302" font-size="13" fill="#33445c">• share: grants a concept</text>
  <text x="248" y="328" font-size="13" fill="#33445c">• markings: block it</text>
  <text x="248" y="354" font-size="13" fill="#33445c">• law flows down to children</text>
  <text x="248" y="380" font-size="13" fill="#33445c">• members + roles approve</text>
  <text x="248" y="406" font-size="13" fill="#33445c">• your Gmail + Calendar,</text>
  <text x="261" y="432" font-size="13" fill="#33445c">read-only, redacted</text>
  <text x="248" y="458" font-size="13" fill="#33445c">• typed schemas: an ontology</text>
  <circle cx="606.0" cy="118" r="7" fill="#d4a72c"/>
  <rect x="484" y="146" width="244" height="340" rx="10" fill="#fff8e5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="500" y="180" font-size="24" fill="#7d4e00" font-weight="700">v2.1</text>
  <text x="712" y="178" font-size="12" fill="#57606a" text-anchor="end">Oct 10 - 11</text>
  <text x="500" y="208" font-size="15" fill="#1f2328" font-weight="700">Reach and billing</text>
  <line x1="500" y1="222" x2="712" y2="222" stroke="#d4a72c" stroke-width="1"/>
  <text x="500" y="250" font-size="13" fill="#5c4813">• Google Drive, read-only</text>
  <text x="500" y="276" font-size="13" fill="#5c4813">• billing chosen per agent:</text>
  <text x="513" y="302" font-size="13" fill="#5c4813">Claude subscription,</text>
  <text x="513" y="328" font-size="13" fill="#5c4813">metered API credits,</text>
  <text x="513" y="354" font-size="13" fill="#5c4813">or Codex (ChatGPT plan)</text>
  <text x="500" y="380" font-size="13" fill="#5c4813">• every harness tested live</text>
  <circle cx="858.0" cy="118" r="7" fill="#1a7f37"/>
  <rect x="736" y="146" width="244" height="340" rx="10" fill="#e9f5ee" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="752" y="180" font-size="24" fill="#116329" font-weight="700">v2.2</text>
  <text x="964" y="178" font-size="12" fill="#57606a" text-anchor="end">Oct 11 - 18</text>
  <text x="752" y="208" font-size="15" fill="#1f2328" font-weight="700">Memory you can trust</text>
  <line x1="752" y1="222" x2="964" y2="222" stroke="#1a7f37" stroke-width="1"/>
  <text x="752" y="250" font-size="13" fill="#2f4a3a">• OKF v0.2 frontmatter:</text>
  <text x="765" y="276" font-size="13" fill="#2f4a3a">provenance, trust tier,</text>
  <text x="765" y="302" font-size="13" fill="#2f4a3a">lifecycle, staleness</text>
  <text x="752" y="328" font-size="13" fill="#2f4a3a">• agents weigh what they read</text>
  <text x="752" y="354" font-size="13" fill="#2f4a3a">• okf trust · okf migrate</text>
  <text x="752" y="380" font-size="13" fill="#2f4a3a">• durable manual beats</text>
  <text x="752" y="406" font-size="13" fill="#2f4a3a">• self-rotating credentials</text>
  <circle cx="1114.0" cy="118" r="7" fill="#611f69"/>
  <rect x="988" y="146" width="252" height="340" rx="10" fill="#f9f0f9" stroke="#611f69" stroke-width="1.5"/>
  <text x="1004" y="180" font-size="24" fill="#4a154b" font-weight="700">v2.3</text>
  <text x="1224" y="178" font-size="12" fill="#57606a" text-anchor="end">Oct 18</text>
  <text x="1004" y="208" font-size="15" fill="#1f2328" font-weight="700">Multiplayer in Slack</text>
  <line x1="1004" y1="222" x2="1224" y2="222" stroke="#611f69" stroke-width="1"/>
  <text x="1004" y="250" font-size="13" fill="#3d2a3e">• the brief posts to a channel</text>
  <text x="1004" y="276" font-size="13" fill="#3d2a3e">• @ it: it reads the thread</text>
  <text x="1017" y="302" font-size="13" fill="#3d2a3e">and answers in it</text>
  <text x="1004" y="328" font-size="13" fill="#3d2a3e">• allowlist, or the whole room</text>
  <text x="1004" y="354" font-size="13" fill="#3d2a3e">• cloud Worker or laptop</text>
  <text x="1004" y="380" font-size="13" fill="#3d2a3e">• alerts follow the channel</text>
  <text x="1004" y="406" font-size="13" fill="#3d2a3e">• two brains, one workspace</text>
  <rect x="40" y="506" width="1200" height="84" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160.0" y="548" font-size="30" fill="#0a5bd3" font-weight="700" text-anchor="middle">11</text>
  <text x="160.0" y="572" font-size="12.5" fill="#57606a" text-anchor="middle">releases</text>
  <text x="400.0" y="548" font-size="30" fill="#0a5bd3" font-weight="700" text-anchor="middle">9</text>
  <text x="400.0" y="572" font-size="12.5" fill="#57606a" text-anchor="middle">days</text>
  <text x="640.0" y="548" font-size="30" fill="#0a5bd3" font-weight="700" text-anchor="middle">594</text>
  <text x="640.0" y="572" font-size="12.5" fill="#57606a" text-anchor="middle">tests, green before every tag</text>
  <text x="880.0" y="548" font-size="30" fill="#0a5bd3" font-weight="700" text-anchor="middle">162</text>
  <text x="880.0" y="572" font-size="12.5" fill="#57606a" text-anchor="middle">files changed</text>
  <text x="1120.0" y="548" font-size="30" fill="#0a5bd3" font-weight="700" text-anchor="middle">+13k</text>
  <text x="1120.0" y="572" font-size="12.5" fill="#57606a" text-anchor="middle">lines added</text>
  <text x="40" y="626" font-size="13" fill="#57606a"><tspan font-weight="700" fill="#1f2328">What didn't change:</tspan> safety lives in code, git is the only durable store, every answer is committed before it is spoken, and one public engine runs every private brain.</text>
</svg>
